name: Technical preview

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:install
      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag must match package.json version.' }
      - run: npm run release:preview
      - name: Verify extracted distribution
        shell: powershell
        run: |
          $archive = (Get-ChildItem releases -Filter '*-source.zip').FullName
          .\scripts\Test-PreviewRelease.ps1 -Archive $archive
      - uses: actions/upload-artifact@v4
        if: matrix.node == '22'
        with:
          name: preview-source
          path: |
            releases/*-source.zip
            releases/*-source.zip.sha256
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: preview-source
          path: release-assets
      - name: Publish preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease --title "Agent Office $GITHUB_REF_NAME technical preview" --notes-file CHANGELOG.md
